.content>.card:last-child:nth-child(odd){grid-column:1 / -1}

tbody tr:nth-child(even) td{background:#f8fafc}
tr.total td{font-weight:700;border-top:2px solid}
.totales .title,.totales th{background:linear-gradient(135deg,#002b53 0%,#001a3a 100%);color:#fff}
.totales tr.total td{background:#dce7f5;color:#002b53;border-color:#002b53}

.potenciales tr.total td{background:#d6f7e8;color:#0b5a3a;border-color:#3ddc97}
.legend{padding:0 40px 18px;font-size:12.5px;color:#475569}
.funnel{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:30px 60px 10px}
.fcol h4{text-align:center;font-size:20px;color:#002b53;margin-bottom:14px}
.fstep{margin:0 auto 10px;padding:14px 10px;text-align:center;color:#fff;border-radius:6px;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.fstep b{font-size:26px;display:block;line-height:1.1}.fstep span{font-size:13px;opacity:.95}
.s1{width:100%;background:#002b53}.s2{width:82%;background:#39a6c7}.s3{width:64%;background:#2fc58a}
@media print{@page{size:1280px auto;margin:10mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}

.fl{font-weight:600;color:#002b53;font-size:15px;margin-right:4px}

.chip:hover{background:#e8eef6}.chip.active{background:#002b53;color:#fff}
.hint{font-size:12.5px;color:#64748b;margin-left:6px}
.empty{text-align:center!important;color:#475569;padding:18px!important}
.etapas col.c-e{width:16%}
.etapas td small.in{display:inline;font-size:12.5px;color:#64748b;font-weight:600}
.etapas td.off,.etapas th.off{opacity:.38}
.etapas td.tot{font-weight:700;background:#dce7f5!important;color:#002b53}
.etapas th.tot{box-shadow:inset 0 -3px 0 #43bee0}
.etapas col.c-e{width:14%}
.etapas td{font-size:15px}
.slide.totales .content.full{padding-top:6px}
@media print{.bar{display:none}}

  const rb=P.b.rows.filter(r=>sel.includes(r[FI.etapa])),rk=P.k.rows.filter(r=>sel.includes(r[FI.etapa]));
  const out={};
  for(const seg of ['totales','perfilados','potenciales']){
    const sb=rb.filter(SEG[seg]),sk=rk.filter(SEG[seg]);
    const slides=BASE.concat(EXTRA[seg]?[EXTRA[seg]]:[]).map(sl=>({name:sl.name,tables:sl.tables.map(t=>buildTable(t,sb,sk))}));
    out[seg]={nb:sb.length,nk:sk.length,slides};
  }
  return out;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pc(n,t){return t?n/t*100:null}
function fp(v){return v===null?'–':Math.round(v)+'%'}
function table(t){
  let h='<div class="card"><table><colgroup><col class="c-lbl"><col class="c-n"><col class="c-n"><col class="c-n"><col class="c-n"></colgroup><thead>'+
   '<tr><th class="lbl" rowspan="2">'+esc(t.head)+'</th><th class="proj sep" colspan="2">Baruma</th><th class="proj sep" colspan="2">Koralum</th></tr>'+
   '<tr class="sub"><th class="sep">Leads</th><th>%</th><th class="sep">Leads</th><th>%</th></tr></thead><tbody>';
  if(!t.tb&&!t.tk) return h+'<tr><td colspan="5" class="empty">Sin registros</td></tr></tbody></table></div>';
  t.rows.forEach(r=>{
    let lbl=esc(r[0]); if(t.sub[r[0]]) lbl+='<small>'+esc(t.sub[r[0]])+'</small>';
    h+='<tr><td>'+lbl+'</td><td class="sep">'+r[1]+'</td><td class="pb">'+fp(pc(r[1],t.tb))+'</td><td class="sep">'+r[2]+'</td><td class="pk">'+fp(pc(r[2],t.tk))+'</td></tr>';
  });
  h+='<tr class="total"><td>Total</td><td class="sep">'+t.tb+'</td><td>'+(t.tb?'100%':'–')+'</td><td class="sep">'+t.tk+'</td><td>'+(t.tk?'100%':'–')+'</td></tr></tbody></table>';
  return h+'</div>';
}
function selLabel(sel){return sel.length===DATA.etapas.length?'Todas las etapas':sel.join(' + ');}
function fcol(name,a,b,c){return '<div class="fcol"><h4>'+name+'</h4>'+
 '<div class="fstep s1"><b>'+a+'</b><span>Leads Totales · '+(a?'100%':'–')+'</span></div>'+
 '<div class="fstep s2"><b>'+b+'</b><span>Leads Perfilados · '+fp(pc(b,a))+'</span></div>'+
 '<div class="fstep s3"><b>'+c+'</b><span>Leads Potenciales · '+fp(pc(c,a))+'</span></div></div>';}
function etapaTable(sel){
  const E=DATA.etapas, st=rows=>[rows.length,rows.filter(SEG.perfilados).length,rows.filter(SEG.potenciales).length];
  const data={b:E.map(e=>st(P.b.rows.filter(r=>r[FI.etapa]===e))).concat([st(P.b.rows)]),k:E.map(e=>st(P.k.rows.filter(r=>r[FI.etapa]===e))).concat([st(P.k.rows)])};
  const cls=(i,first)=>(first?'sep ':'')+(i<E.length?(sel.includes(E[i])?'on':'off'):'tot');
  let h='<div class="card etapas"><table><colgroup><col class="c-e">'+'<col>'.repeat(2*(E.length+1))+'</colgroup><thead><tr><th class="lbl" rowspan="2">Segmento</th><th class="proj sep" colspan="'+(E.length+1)+'">Baruma</th><th class="proj sep" colspan="'+(E.length+1)+'">Koralum</th></tr><tr class="sub">';
  for(const p of ['b','k']){E.forEach((e,i)=>h+='<th class="'+cls(i,i===0)+'">'+esc(e)+'</th>');h+='<th class="tot">Total</th>';}
  h+='</tr></thead><tbody>';
  ['Totales','Perfilados','Potenciales'].forEach((lab,j)=>{
    h+='<tr'+(j===0?' class="first"':'')+'><td>'+lab+'</td>';
    for(const p of ['b','k'])data[p].forEach((v,i)=>{h+='<td class="'+cls(i,i===0)+'">'+v[j]+(j?' <small class="in">'+fp(pc(v[j],v[0]))+'</small>':'')+'</td>';});
    h+='</tr>';});
  return h+'</tbody></table></div>';
}
function render(sel){
  const M=buildModel(sel),T=M.totales,Pf=M.perfilados,Q=M.potenciales,lab=selLabel(sel);
  let html='<section class="slide totales"><div class="title"><span>Fake Door – Baruma vs. Koralum</span><small>Embudo comparativo · '+esc(lab)+'</small></div>'+
   '<div class="funnel">'+fcol('Baruma',T.nb,Pf.nb,Q.nb)+fcol('Koralum',T.nk,Pf.nk,Q.nk)+'</div>'+
   '<div class="content full">'+etapaTable(sel)+'</div>'+
   '<div class="legend">Leads Perfilados = estado Perfilado + Potencial. Porcentajes calculados sobre los Leads Totales de cada proyecto y etapa. Las columnas atenuadas de la tabla de etapas no están incluidas en el filtro actual.</div></section>';
  for(const seg of ['totales','perfilados','potenciales']){
    const d=M[seg];
    d.slides.forEach(sl=>{
      const full=sl.tables.length===1;
      html+='<section class="slide '+seg+'"><div class="title"><span>'+esc(LABEL[seg]+' – '+sl.name)+'</span><small>'+esc(lab)+' · Baruma n = '+d.nb+' · Koralum n = '+d.nk+'</small></div><div class="content'+(full?' full':'')+'">'+sl.tables.map(table).join('')+'</div></section>';
    });
  }
  document.getElementById('app').innerHTML=html;
}
let SEL=DATA.etapas.slice();
function drawBar(){
  const all=SEL.length===DATA.etapas.length;
  let h='<span class="fl">Filtrar por etapa:</span><button data-e="*" class="chip'+(all?' active':'')+'">Todas</button>';
  DATA.etapas.forEach(e=>{h+='<button data-e="'+esc(e)+'" class="chip'+(!all&&SEL.includes(e)?' active':'')+'">'+esc(e)+'</button>';});
  h+='<span class="hint">Puedes seleccionar varias etapas.</span>';
  const bar=document.getElementById('bar');bar.innerHTML=h;
  bar.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const e=b.getAttribute('data-e');
    if(e==='*'){SEL=DATA.etapas.slice();}
    else if(all){SEL=[e];}
    else{SEL=SEL.includes(e)?SEL.filter(x=>x!==e):SEL.concat(e);if(!SEL.length)SEL=DATA.etapas.slice();SEL.sort();}
    drawBar();render(SEL);}));
}
if(typeof NODE_TEST==='undefined'){drawBar();render(SEL);}

</script>
</body>
